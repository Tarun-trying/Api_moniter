## render.yaml — Deploy PulseMonitor to Render.com
## https://render.com/docs/blueprint-spec

services:
  # ── Backend ──────────────────────────────────────────────────────────────
  - type: web
    name: pulsemonitor-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MONGODB_URI
        sync: false          # Set manually in Render dashboard
      - key: MONGODB_DB
        value: pulsemonitor
      - key: ALLOWED_ORIGINS
        sync: false          # Set to your frontend URL after it's deployed
    healthCheckPath: /api/health

  # ── Frontend ─────────────────────────────────────────────────────────────
  - type: web
    name: pulsemonitor-frontend
    runtime: static
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false          # Set to your backend URL (e.g. https://pulsemonitor-backend.onrender.com)
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
