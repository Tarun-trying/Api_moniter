version: '3.9'

services:
  # ── Backend (FastAPI) ────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pulsemonitor-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      - PORT=8000
      - ALLOWED_ORIGINS=http://localhost,http://frontend
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Frontend (React + nginx) ─────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # In compose, frontend calls backend via the internal service name
        VITE_API_URL: http://backend:8000
    container_name: pulsemonitor-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
